name: Release build

on:
  release:
    types: [ created ]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Release tag to rebuild and republish, for example v1.0.0-RC1
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release-tag: ${{ steps.release.outputs.release-tag }}
      version: ${{ steps.details.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release-tag || github.ref }}

      - name: Resolve release tag
        id: release
        uses: actions/github-script@v8
        env:
          INPUT_RELEASE_TAG: ${{ inputs.release-tag }}
        with:
          script: |
            if (context.eventName === "release") {
              core.setOutput("release-tag", context.payload.release.tag_name);
              return;
            }

            core.setOutput("release-tag", process.env.INPUT_RELEASE_TAG);

      - name: Extract release version
        id: details
        run: |
          echo "version=${{ steps.release.outputs.release-tag }}" | sed 's/^version=v/version=/' >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.release-tag }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          check-latest: true

      - name: Build and publish
        env:
          PUBLISH_USER: ${{ secrets.PUBLISH_USER }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./gradlew --no-daemon test publish
