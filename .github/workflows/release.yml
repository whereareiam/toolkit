name: Release
run-name: "${{ github.event_name == 'release' && format('Release {0}', github.event.release.tag_name) || format('Republish {0}', inputs.release-tag) }}"

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: Tag of the existing release to rebuild and republish, for example v0.3.0
        required: true
        type: string

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release-tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Read release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.release-tag }}
        run: |
          set -euo pipefail
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          if jq -e '(.body // "") | contains("[Short subtitle]") or contains("[1-2 sentence summary")' <<<"$release" >/dev/null; then
            echo "::error::Release $TAG still has the subtitle or summary placeholder of the draft; fill in .github/release-notes.md or edit the release, then publish again."
            exit 1
          fi
          echo "tag=$(jq -r '.tag_name' <<<"$release")" >> "$GITHUB_OUTPUT"

  # The tag keeps its v prefix; the published version drops it, so v0.3.0 publishes 0.3.0.
  verify:
    name: Verify
    needs: resolve
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-verify.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.tag }}
      artifacts: true

  publish:
    name: Publish
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-publish.yml
    with:
      commit: ${{ needs.verify.outputs.commit }}
      version: ${{ needs.verify.outputs.version }}

  attach:
    name: Attach jars to the release
    needs: [resolve, verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: toolkit-${{ needs.verify.outputs.version }}
          path: jars

      - name: Upload jars
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t jars < <(find jars -name '*.jar' | sort)
          duplicates="$(printf '%s\n' "${jars[@]##*/}" | sort | uniq -d)"
          [[ -z "$duplicates" ]] || { echo "Duplicate jar names: $duplicates" >&2; exit 1; }
          gh release upload "$TAG" "${jars[@]}" --clobber --repo "$GITHUB_REPOSITORY"
