name: Development build

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  validate-ref:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Reject release refs for manual development publish
        run: |
          case "${GITHUB_REF_NAME}" in
            release|release/*)
              echo "Manual development publish is not allowed from ${GITHUB_REF_NAME}."
              exit 1
              ;;
          esac

  prepare:
    needs: validate-ref
    if: always() && (github.event_name != 'workflow_dispatch' || needs.validate-ref.result == 'success')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.details.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract development version
        id: details
        run: |
          branch_name="${GITHUB_REF_NAME//\//-}"
          echo "version=${branch_name}-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          check-latest: true

      - name: Build and publish
        uses: whereareiam/devops/actions/registry/maven-publish@v1
        with:
          visibility: public
          repository: packages
          command: ./gradlew --no-daemon test publish
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
