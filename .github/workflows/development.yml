name: Development build
run-name: "Development build of ${{ github.ref_name }}"

on:
  workflow_dispatch:

concurrency:
  group: development-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-ref:
    name: Validate ref
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject release refs
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            release|release/*)
              echo "::error::Development builds are not published from $REF_NAME."
              exit 1
              ;;
          esac

  verify:
    name: Verify
    needs: validate-ref
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-verify.yml
    with:
      ref: ${{ github.sha }}

  publish:
    name: Publish
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-publish.yml
    with:
      commit: ${{ needs.verify.outputs.commit }}
      version: ${{ needs.verify.outputs.version }}
